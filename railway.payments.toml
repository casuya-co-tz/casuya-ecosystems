# Casuya Payments — Railway Config (root monorepo)
# Builds from monorepo root so @casuya/common workspace dep resolves

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.payments"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "8080"
