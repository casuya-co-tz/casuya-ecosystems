# Casuya API Gateway — Railway Config
# Deploys as a web service from the casuya-api repo
# NOTE: Requires workspace deps (@casuya/common, casuya-exams, casuya-math)
# The Dockerfile builds the full monorepo to resolve these.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "8080"
