# Casuya Ecosystem — Render Blueprint
# Deploys: casuya-ai, casuya-api, casuya-orchestrator + PostgreSQL + Redis
# casuya-platform is already deployed separately (render.yaml in casuya-platform repo)
# Frontend is deployed on Vercel

# NOTE: Enable "Clone Submodules" in Render dashboard when creating this blueprint
# (Settings → General → Clone Submodules: ON) so workspace deps resolve.

services:
  # ── AI Microservice (Port 3000) ──────────────────────────────────────────
  - type: web
    name: casuya-ai
    runtime: docker
    dockerfilePath: ./casuya-ai/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CASUYA_AI_PORT
        value: '3000'
      - key: PORT
        value: '3000'

  # ── API Gateway (Port 8080) ──────────────────────────────────────────────
  - type: web
    name: casuya-api
    runtime: docker
    dockerfilePath: ./casuya-api/Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: DATABASE_URL
        fromDatabase:
          name: casuya-postgres
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: casuya-redis
          property: connectionString
      - key: CASUYA_AI_URL
        value: https://casuya-ai.onrender.com

  # ── Orchestrator Worker (Port 8082) ──────────────────────────────────────
  - type: worker
    name: casuya-orchestrator
    runtime: docker
    dockerfilePath: ./casuya-orchestrator/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8082'
      - key: DATABASE_URL
        fromDatabase:
          name: casuya-postgres
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: casuya-redis
          property: connectionString

databases:
  # ── PostgreSQL ───────────────────────────────────────────────────────────
  - name: casuya-postgres
    databaseName: casuya
    plan: free

  # ── Redis ────────────────────────────────────────────────────────────────
  - name: casuya-redis
    plan: free
